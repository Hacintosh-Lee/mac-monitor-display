; ESP32-C3 + 2.4" ST7789 (240x320) Mac 监控屏
; env:scanner  -> 引脚探测固件
; env:monitor  -> 正式监控固件

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 不写死串口, 让 PlatformIO 自动探测, 换机器/换 USB 口都不用改
; 这块板子的 EON 4MB flash 在 80MHz 下 bootloader 读不出 app, 会 13ms 一次疯狂重启。
; 必须降到 40MHz, 否则任何固件都起不来。
board_build.f_flash = 40000000L
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:hello]
build_src_filter = +<hello/>

[env:hello40]
build_src_filter = +<hello/>
board_build.f_flash = 40000000L
board_build.flash_mode = dout

[env:focus]
build_src_filter = +<focus/>

[env:pintest]
build_src_filter = +<pintest/>

[env:scanner]
build_src_filter = +<scanner/>

; 深色科技风(默认)
[env:monitor]
build_src_filter = +<monitor/>
lib_deps =
    lovyan03/LovyanGFX@^1.1.16

; 深色科技风 —— 横版 320x240
[env:land]
build_src_filter = +<monitor_land/>
lib_deps =
    lovyan03/LovyanGFX@^1.1.16

; 浅色 Apple 风
[env:light]
build_src_filter = +<monitor_light/>
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
